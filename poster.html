<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poster - SKY MEMORIES Stamp Rally</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Sarabun', sans-serif;
    }

    /* ขนาดอัตราส่วน 4:5 สำหรับโพสต์ Social Media / โปสเตอร์แนวตั้ง */
    .poster-container {
      width: 100%;
      max-width: 480px;
      height: 600px;
      background: linear-gradient(180deg, #1d3557 0%, #457b9d 60%, #a8dadc 100%);
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
    }

    /* ตกแต่งพื้นหลังสไตล์ก้อนเมฆ/น่านฟ้า */
    .poster-container::before {
      content: "✈️";
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 50px;
      opacity: 0.2;
      transform: rotate(-15deg);
    }

    /* ---------------- 1. หัวเรื่องสไตล์ Lemon8 ---------------- */
    .header-tag {
      align-self: flex-start;
      background: #f1faee;
      color: #1d3557;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin-bottom: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .main-headline {
      font-family: 'Kanit', sans-serif;
      font-size: 30px;
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      text-shadow: 0 3px 8px rgba(0, 0, 0, 0.4);
      margin-bottom: 8px;
    }

    .main-headline span {
      color: #a8dadc;
      background: rgba(29, 53, 87, 0.8);
      padding: 2px 8px;
      border-radius: 8px;
    }

    /* ---------------- 2. กล่องแสดงตัวอย่างการ์ด ---------------- */
    .card-preview-box {
      width: 100%;
      height: 190px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      border: 2px dashed rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      margin: 10px 0;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
    }

    .card-mockup {
      width: 85%;
      height: 130px;
      background: #e0f2fe;
      border: 3px solid #1d3557;
      border-radius: 10px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      transform: rotate(-2deg);
    }

    .card-mockup-title {
      position: absolute;
      top: 8px;
      left: 10px;
      font-family: 'Kanit', sans-serif;
      font-size: 12px;
      font-weight: bold;
      color: #1d3557;
    }

    .stamps-grid {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .stamp-dot {
      width: 32px;
      height: 32px;
      background: #ffffff;
      border: 2px solid #457b9d;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 14px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .badge-free {
      position: absolute;
      top: -12px;
      right: 10px;
      background: #e63946;
      color: #fff;
      font-family: 'Kanit', sans-serif;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 12px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transform: rotate(5deg);
    }

    /* ---------------- 3. ขั้นตอนการร่วมสนุก ---------------- */
    .steps-container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 14px;
      color: #1d3557;
      box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    }

    .steps-title {
      font-family: 'Kanit', sans-serif;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #e63946;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .step-list {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .step-item {
      flex: 1;
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 10px;
      padding: 8px 5px;
      text-align: center;
    }

    .step-number {
      background: #1d3557;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 4px auto;
    }

    .step-text {
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    /* ---------------- 4. ส่วนท้าย (Footer) ---------------- */
    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1d3557;
      margin: -10px -24px -24px -24px;
      padding: 14px 24px;
      border-top: 2px solid #a8dadc;
    }

    .location-text {
      font-size: 12px;
    }

    .location-text strong {
      font-family: 'Kanit', sans-serif;
      font-size: 14px;
      color: #a8dadc;
      display: block;
    }

    .qr-placeholder {
      width: 50px;
      height: 50px;
      background: #fff;
      border-radius: 8px;
      padding: 3px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .qr-placeholder img {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="poster-container">
    
    <!-- Header -->
    <div>
      <div class="header-tag">📍 พิพิธภัณฑ์กองทัพอากาศฯ</div>
      <div class="main-headline">
        ตามล่าแสตมป์<br>
        <span>SKY MEMORIES</span> ✈️
      </div>
    </div>

    <!-- Card Preview Section -->
    <div class="card-preview-box">
      <div class="badge-free">เข้าร่วมฟรี! 🎟️</div>
      <div class="card-mockup">
        <div class="card-mockup-title">SKY MEMORIES PASSPORT</div>
        <div class="stamps-grid">
          <div class="stamp-dot">🛩️</div>
          <div class="stamp-dot">✈️</div>
          <div class="stamp-dot">🚁</div>
          <div class="stamp-dot">🛩️</div>
          <div class="stamp-dot">✈️</div>
        </div>
      </div>
    </div>

    <!-- How to Play Steps -->
    <div class="steps-container">
      <div class="steps-title">🔥 วิธีร่วมสนุกง่ายๆ ใน 3 ขั้นตอน:</div>
      <div class="step-list">
        <div class="step-item">
          <div class="step-number">1</div>
          <div class="step-text">สแกน QR หน้าเครื่องบิน</div>
        </div>
        <div class="step-item">
          <div class="step-number">2</div>
          <div class="step-text">สะสมแสตมป์ ครบ 5 ลาย</div>
        </div>
        <div class="step-item">
          <div class="step-number">3</div>
          <div class="step-text">รับการ์ดรูป สวยๆ กลับบ้าน</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-info">
      <div class="location-text">
        <strong>พิพิธภัณฑ์กองทัพอากาศและการบินแห่งชาติ</strong>
        ดอนเมือง กรุงเทพมหานคร (มีที่จอดรถสะดวก)
      </div>
      <div class="qr-placeholder">
        <!-- ใส่รูป QR Code สำหรับสแกนเข้าเว็บจริงตรงนี้ -->
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://rtaf-museum.github.io" alt="QR Code">
      </div>
    </div>

  </div>

</body>
</html>
